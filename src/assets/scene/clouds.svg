<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="260" viewBox="0 0 1600 260">
  <!-- Soft, blurred cumulus clouds with a light top and a slightly shaded base. The tile repeats
       seamlessly: no cloud crosses the left or right edge. -->
  <defs>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="wisp" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#fdf6f3"/>
      <stop offset="1" stop-color="#efd9d1"/>
    </linearGradient>
  </defs>

  <!-- Cloud 1 -->
  <g transform="translate(70 30)" opacity=".9">
    <ellipse cx="110" cy="62" rx="110" ry="20" fill="#ead2c9" filter="url(#wisp)"/>
    <g filter="url(#soft)" fill="url(#shade)">
      <ellipse cx="110" cy="56" rx="104" ry="22"/>
      <circle cx="60" cy="46" r="26"/>
      <circle cx="104" cy="32" r="36"/>
      <circle cx="150" cy="40" r="28"/>
      <circle cx="182" cy="52" r="18"/>
    </g>
    <g filter="url(#soft)" fill="#ffffff" opacity=".8">
      <circle cx="96" cy="24" r="20"/>
      <circle cx="142" cy="32" r="14"/>
    </g>
  </g>

  <!-- Cloud 2 (larger, lower, fainter) -->
  <g transform="translate(400 100)" opacity=".7">
    <ellipse cx="150" cy="70" rx="150" ry="22" fill="#ead2c9" filter="url(#wisp)"/>
    <g filter="url(#soft)" fill="url(#shade)">
      <ellipse cx="150" cy="62" rx="146" ry="24"/>
      <circle cx="78" cy="50" r="30"/>
      <circle cx="132" cy="34" r="42"/>
      <circle cx="190" cy="40" r="34"/>
      <circle cx="238" cy="56" r="22"/>
    </g>
    <g filter="url(#soft)" fill="#ffffff" opacity=".8">
      <circle cx="122" cy="22" r="24"/>
      <circle cx="184" cy="30" r="18"/>
    </g>
  </g>

  <!-- Cloud 3 (small, high) -->
  <g transform="translate(830 24)" opacity=".85">
    <ellipse cx="70" cy="44" rx="72" ry="14" fill="#ead2c9" filter="url(#wisp)"/>
    <g filter="url(#soft)" fill="url(#shade)">
      <ellipse cx="70" cy="40" rx="68" ry="16"/>
      <circle cx="44" cy="32" r="18"/>
      <circle cx="74" cy="22" r="24"/>
      <circle cx="104" cy="32" r="16"/>
    </g>
  </g>

  <!-- Cloud 4 (long, low) -->
  <g transform="translate(1060 92)" opacity=".65">
    <ellipse cx="160" cy="60" rx="160" ry="20" fill="#ead2c9" filter="url(#wisp)"/>
    <g filter="url(#soft)" fill="url(#shade)">
      <ellipse cx="160" cy="54" rx="156" ry="20"/>
      <circle cx="90" cy="44" r="26"/>
      <circle cx="150" cy="30" r="36"/>
      <circle cx="208" cy="38" r="28"/>
      <circle cx="252" cy="48" r="18"/>
    </g>
    <g filter="url(#soft)" fill="#ffffff" opacity=".75">
      <circle cx="140" cy="20" r="20"/>
    </g>
  </g>

  <!-- Cloud 5 (thin wisp) -->
  <g transform="translate(1390 40)" opacity=".7">
    <g filter="url(#wisp)" fill="#ffffff">
      <ellipse cx="80" cy="30" rx="80" ry="12"/>
      <ellipse cx="96" cy="20" rx="44" ry="12"/>
    </g>
  </g>
</svg>
